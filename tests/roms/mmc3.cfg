MEMORY {
    HEADER: start = $0000, size = $0010, file = %O;
    PRG0:   start = $8000, size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG1:   start = $A000, size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG2:   start = $C000, size = $2000, file = %O, fill = yes, fillval = $FF;
    PRG3:   start = $E000, size = $2000, file = %O, fill = yes, fillval = $FF;
}
SEGMENTS {
    HEADER:  load = HEADER, type = ro;
    BANK0:   load = PRG0, type = ro;
    BANK1:   load = PRG1, type = ro;
    BANK2:   load = PRG2, type = ro;
    CODE:    load = PRG3, type = ro;
    VECTORS: load = PRG3, type = ro, start = $FFFA;
}
